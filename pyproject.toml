
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailiq"
version = "0.1.0"
description = "Snowflake retail demand forecasting portfolio project"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3.0",
    "snowflake-connector-python[pandas]>=3.12,<5",
    "python-dotenv>=1.0,<2",
    "snowflake-snowpark-python>=1.20,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "joblib>=1.3,<2",
    "streamlit>=1.38,<2",
    "plotly>=5.24,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
